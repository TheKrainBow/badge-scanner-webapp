# Standard nginx WebSocket-upgrade pattern: pass the client's Upgrade
# header through as Connection's value, but only when it's actually a WS
# upgrade request ("upgrade") — otherwise close, so ordinary keep-alive
# HTTP requests through /api/ aren't affected. Needs to live at this (http)
# context level, valid here since this file is included inside the base
# nginx image's http{} block via conf.d/*.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin reverse proxy to the backend: the browser only ever talks
    # to this origin, so the session cookie (SameSite=Lax) and the
    # client-id/secret headers just work with no CORS configuration needed.
    # Also proxies two WebSocket routes under this same prefix: /api/events
    # (browser dashboard live feed) and /api/lookup/ws (the C client's
    # persistent lookup connection, which reaches the backend through this
    # same nginx since the backend container isn't published to the host
    # directly).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # nginx's 60s default is shorter than a full CA directory refetch
        # can legitimately take: it's a synchronous, sequential paginated
        # fetch (backend/internal/caclient's FetchAllUsers), one HTTP
        # round-trip per page, each allowed up to 120s if the CA is slow,
        # with no overall cap. Bulk-refresh progress now streams over
        # /api/events instead, decoupled from this timeout, but the
        # triggering POST itself still needs enough room not to 504
        # spuriously. This same location also carries the two long-lived
        # WebSocket connections above, which must not be killed just for
        # sitting idle between badge taps — hence 1h, not 300s.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /health {
        proxy_pass http://backend:8080/health;
    }

    location / {
        try_files $uri /index.html;
    }
}
